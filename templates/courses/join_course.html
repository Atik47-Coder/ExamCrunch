{% extends 'base.html' %}

{% block title %}Join a course{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 form-card">
    <div class="card-body p-4">
        <h1 class="h3 mb-1"><i class="bi bi-key text-primary"></i> Join a course</h1>
        <p class="text-body-secondary">Type the invite code you received from a moderator or classmate.</p>

        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'partials/form.html' %}
            <button type="submit" class="btn btn-primary">Join course</button>
            <a href="{% url 'my_courses' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
